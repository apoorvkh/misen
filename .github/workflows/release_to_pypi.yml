name: release_to_pypi

on:
    release:
        types: [published]

jobs:
    release-to-pypi:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "0.12.3"
            - run: uv build
            - run: uv publish
