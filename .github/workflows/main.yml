name: Run checks on push or PR to main

on:
    push:
        branches: [main]
    pull_request:
        branches:
            - main

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "0.12.3"
                  enable-cache: true
            - run: uv sync
            - run: uv run --frozen pytest -q
            - run: uv run --frozen ruff check src
              if: success() || failure()
            - run: uv run --frozen ruff format --check
              if: success() || failure()
            - run: uv run --frozen ty check src
              if: success() || failure()
    ssh:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python: ["3.11", "3.14"]
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "0.12.3"
                  python-version: ${{ matrix.python }}
                  enable-cache: true
            - run: uv sync --frozen --extra ssh
            - run: uv run --frozen --extra ssh pytest -q tests/test_ssh_executor.py tests/test_ssh_runtime.py tests/test_imports.py tests/test_experiment_cli.py tests/test_settings.py
