name: Run checks on push or PR to main

on:
    push:
        branches: [main]
    pull_request:
        branches:
            - main

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "0.12.3"
                  python-version-file: ".python-version"
                  enable-cache: true
            - run: uv sync
            - run: uv run --frozen pytest -q
            - run: uv run --frozen ruff check src
              if: success() || failure()
            - run: uv run --frozen ruff format --check
              if: success() || failure()
            - run: uv run --frozen ty check src
              if: success() || failure()
    skypilot-python-314:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "0.12.3"
                  python-version: "3.14"
                  enable-cache: true
            - run: uv sync --frozen --extra skypilot
            - run: >-
                  uv run --frozen --extra skypilot python -c
                  "from misen.executors.skypilot import _load_skypilot;
                  assert _load_skypilot().__version__.startswith('0.13.')"
            - run: uv run --frozen --extra skypilot pytest -q tests/test_skypilot_executor.py
