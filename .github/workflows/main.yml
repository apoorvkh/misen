name: Run checks on push or PR to main

on:
    push:
        branches: [main]
    pull_request:
        branches:
            - main

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "0.12.3"
                  enable-cache: true
            - run: uv sync
            - run: uv run --frozen pytest -q
            - run: uv run --frozen ruff check src
              if: success() || failure()
            - run: uv run --frozen ruff format --check
              if: success() || failure()
            - run: uv run --frozen ty check src
              if: success() || failure()
    skypilot-python-314:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                skypilot:
                    - "==0.13.0"
                    - ">=0.13"
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "0.12.3"
                  python-version: "3.14"
                  enable-cache: true
            - run: uv sync --frozen
            - run: uv pip install --python .venv/bin/python "skypilot${{ matrix.skypilot }}"
            - run: .venv/bin/pytest -q tests/test_skypilot_executor.py tests/test_skypilot_server.py
